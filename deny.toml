# cargo-deny configuration for Callchain node
# https://embarkstudios.github.io/cargo-deny/

[advisories]
yanked = "warn"
ignore = []

[bans]
# Lint level for when multiple versions of the same crate are detected
multiple-versions = "warn"
# Lint level for when a crate version requirement is `*`
wildcards = "allow"
highlight = "all"
# Deny OpenSSL — use rustls instead
deny = [{ name = "openssl" }]
skip = []
skip-tree = []

[licenses]
version = 2
confidence-threshold = 0.8
# Ignore private workspace members
private = { ignore = true }
unused-allowed-license = "warn"

allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "0BSD",
    "CC0-1.0",
    "ISC",
    "Unlicense",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
    "OpenSSL",
]

exceptions = []

[sources]
unknown-registry = "warn"
unknown-git = "deny"
allow-git = [
    "https://github.com/paradigmxyz/reth",
    "https://github.com/commonwarexyz/monorepo",
]
