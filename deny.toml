# cargo-deny configuration for Callchain node
# https://embarkstudios.github.io/cargo-deny/

[advisories]
yanked = "warn"
# These advisories are all in upstream transitive dependencies (reth, rustls,
# jsonrpsee, etc.) and cannot be resolved by semver-compatible `cargo update`.
# They must wait for the upstream crates to release new major versions.
ignore = [
    "RUSTSEC-2024-0388",  # derivative unmaintained
    "RUSTSEC-2024-0436",  # paste unmaintained
    "RUSTSEC-2025-0055",  # anstream ANSI injection in logs
    "RUSTSEC-2025-0134",  # rustls-pemfile unmaintained
    "RUSTSEC-2025-0141",  # bincode unmaintained
    "RUSTSEC-2026-0097",  # rand unsound with custom logger
    "RUSTSEC-2026-0098",  # rustls-webpki URI name constraints
    "RUSTSEC-2026-0099",  # rustls-webpki wildcard name constraints
    "RUSTSEC-2026-0104",  # x509-parser CRL parsing panic
    "RUSTSEC-2023-0089",  # atomic-polyfill unmaintained (transitive via ark-ec)
    "RUSTSEC-2026-0119",  # hickory-proto O(n²) name compression (needs hickory-resolver >=0.26)
    "RUSTSEC-2026-0173",  # proc-macro-error2 unmaintained (transitive via alloy-sol-macro)
]

[bans]
# Lint level for when multiple versions of the same crate are detected
multiple-versions = "warn"
# Lint level for when a crate version requirement is `*`
wildcards = "allow"
highlight = "all"
# Deny OpenSSL — use rustls instead
deny = [{ name = "openssl" }]
skip = []
skip-tree = []

[licenses]
version = 2
confidence-threshold = 0.8
# Ignore private workspace members
private = { ignore = true }
unused-allowed-license = "warn"

allow = [
    "AGPL-3.0",
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "0BSD",
    "CC0-1.0",
    "ISC",
    "Unlicense",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "OpenSSL",
]

exceptions = []

[sources]
unknown-registry = "warn"
unknown-git = "deny"
allow-git = [
    "https://github.com/paradigmxyz/reth",
    "https://github.com/commonwarexyz/monorepo",
]
