[package]
name = "call-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
aws-kms = ["dep:aws-config", "dep:aws-sdk-kms", "dep:tokio"]
hashi-vault = ["dep:reqwest", "dep:base64"]
keyring = ["dep:keyring", "dep:base64"]

[dependencies]
call-primitives.workspace = true
k256 = { version = "0.13", features = ["ecdsa", "sha256"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha3 = "0.10"
sha2 = "0.10"
rand = "0.8"
rand_core.workspace = true
thiserror.workspace = true
zeroize = "1"
scrypt = "0.11"
aes = "0.8"
ctr = "0.9"
blst = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
reqwest = { workspace = true, optional = true }
aws-config = { version = "1.8", optional = true }
aws-sdk-kms = { version = "1.106", optional = true }
base64 = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
keyring = { version = "3", optional = true }

[dev-dependencies]
hex-literal = "0.4"
hex = "0.4"
criterion = { workspace = true }

[[bench]]
name = "signature_verify"
harness = false
