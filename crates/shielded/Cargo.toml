[package]
name = "call-shielded"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
call-primitives.workspace = true
call-crypto.workspace = true
call-precompile.workspace = true
call-protocol.workspace = true
alloy-primitives.workspace = true
alloy-sol-types.workspace = true
revm-precompile.workspace = true
thiserror.workspace = true
chacha20poly1305 = { version = "0.10", features = ["std"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }

# ZK proving (Halo2 + Pasta curves)
# Plain Poseidon hashing (always available — required for shielded pool)
halo2_gadgets = { workspace = true }
# Full proving + circuit synthesis (gated behind `halo2-prover`)
halo2_proofs = { workspace = true, optional = true }
pasta_curves = { workspace = true }
ff = { workspace = true }
group = { workspace = true }

# Async runtime for blocking proof generation
tokio = { workspace = true, optional = true }

# Prover server dependencies (gated behind prover-server feature)
axum = { workspace = true, optional = true }
serde_json = { workspace = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
hex = { workspace = true, optional = true }

[features]
default = ["poseidon", "halo2-prover"]
poseidon = []
slow-tests = ["poseidon"]
# Legacy alias — maps to halo2-prover for downstream compatibility.
real-prover = ["halo2-prover"]
halo2-prover = [
    "poseidon",
    "halo2_proofs",
    "tokio",
]
prover-server = ["halo2-prover", "axum", "tracing", "tracing-subscriber", "clap", "hex"]

[dev-dependencies]
criterion = { workspace = true }

[[bin]]
name = "prover-server"
path = "src/bin/prover_server.rs"
required-features = ["prover-server"]

[[bench]]
name = "proof_generate"
harness = false
required-features = ["halo2-prover"]
