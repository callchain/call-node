[package]
name = "call-shielded"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
call-primitives.workspace = true
call-crypto.workspace = true
call-precompile.workspace = true
call-protocol.workspace = true
alloy-primitives.workspace = true
alloy-sol-types.workspace = true
revm-precompile.workspace = true
thiserror.workspace = true
chacha20poly1305 = { version = "0.10", features = ["std"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }

# ZK proving (arkworks + BN254)
# Note: ark 0.4 required for poseidon-ark-no-std compatibility
# Plain Poseidon hashing (always available — required for shielded pool)
ark-ff = { version = "0.4" }
ark-bn254 = { version = "0.4" }
poseidon-ark-no-std = { version = "0.0.1" }
# R1CS proving (gated behind `real-prover`)
ark-std = { version = "0.4", optional = true }
ark-ec = { version = "0.4", optional = true }
ark-groth16 = { version = "0.4", optional = true }
ark-r1cs-std = { version = "0.4", optional = true }
ark-relations = { version = "0.4", optional = true }
ark-serialize = { version = "0.4", optional = true }
ark-snark = { version = "0.4", optional = true }
ark-crypto-primitives = { version = "0.4", features = ["crh", "merkle_tree", "sponge"], optional = true }

# Ceremony key loading — SHA-256 for verifying key hash verification
sha2 = { version = "0.10", optional = true }
tokio = { workspace = true, optional = true }

# Prover server dependencies (gated behind prover-server feature)
axum = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
hex = { workspace = true, optional = true }

[features]
default = ["poseidon"]
poseidon = []
slow-tests = ["poseidon"]
real-prover = [
    "poseidon",
    "ark-std",
    "ark-ec",
    "ark-groth16",
    "ark-r1cs-std",
    "ark-relations",
    "ark-serialize",
    "ark-snark",
    "ark-crypto-primitives",
    "tokio",
]
production-keys = ["real-prover", "sha2"]
prover-server = ["real-prover", "axum", "serde_json", "tracing", "tracing-subscriber", "clap", "hex"]

[[bin]]
name = "export_r1cs"
path = "src/bin/export_r1cs.rs"
required-features = ["real-prover"]

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "proof_generate"
harness = false
required-features = ["real-prover"]
