name: Formal Verification

on:
  push:
    branches: [main]
    paths:
      - 'formal_verification/**'
      - 'crates/shielded/**'
  pull_request:
    branches: [main]
    paths:
      - 'formal_verification/**'
      - 'crates/shielded/**'

jobs:
  lean4:
    name: Lean 4 Proofs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: formal_verification/lean

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Cache mathlib
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/mathlib
            formal_verification/lean/.lake
          key: ${{ runner.os }}-mathlib-${{ hashFiles('formal_verification/lean/lakefile.toml') }}
          restore-keys: |
            ${{ runner.os }}-mathlib-

      - name: Fetch mathlib cache
        run: |
          lake exe cache get || true

      - name: Build
        run: lake build

      - name: Verify no sorry
        run: |
          if grep -r "sorry" CallchainShielded/; then
            echo "Found sorry in proofs"
            exit 1
          fi

      - name: Verify axiom count
        run: |
          # Fr.lean models the Pasta Pallas base field (Fp)
          FR_AXIOMS=$(grep -c "axiom" CallchainShielded/Fr.lean || true)
          if [ "$FR_AXIOMS" -gt 1 ]; then
            echo "Too many axioms in Fr.lean: $FR_AXIOMS (expected <= 1)"
            exit 1
          fi

          # R1CSCorrespondence.lean models the historical Groth16/R1CS implementation
          # (3 externally-verified axioms for structural correspondence)
          CORR_AXIOMS=$(grep -c "axiom" CallchainShielded/R1CSCorrespondence.lean || true)
          if [ "$CORR_AXIOMS" -gt 3 ]; then
            echo "Too many axioms in R1CSCorrespondence.lean: $CORR_AXIOMS (expected <= 3)"
            exit 1
          fi

          TOTAL=$((FR_AXIOMS + CORR_AXIOMS))
          echo "Axiom count: Fr.lean=$FR_AXIOMS, R1CSCorrespondence.lean=$CORR_AXIOMS, total=$TOTAL (OK)"

      - name: Test
        run: lake test || true
