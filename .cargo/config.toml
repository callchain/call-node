[alias]
x = "run --package call-xtask --"
xtask = "run --package call-xtask --"
docs = "doc --workspace --all-features --no-deps"

[build]
incremental = true

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

[target.aarch64-apple-darwin]
rustflags = ["-C", "link-arg=-fuse-ld=ld64.lld"]

[env]
# Disable telemetry prompts
RUSTUP_MAX_RETRIES = "0"
